version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://uno_user:uno_pass@postgres:5432/uno_db
    networks:
      - app-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Flutter Frontend (optimized build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.optimized
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/build
      - /app/.dart_tool
    environment:
      - FLUTTER_ROOT=/flutter
      - API_BASE_URL=https://uno-api.jersweb.net
      - WS_BASE_URL=wss://uno-api.jersweb.net
      - BASE_URL=https://uno.jersweb.net
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=uno_db
      - POSTGRES_USER=uno_user
      - POSTGRES_PASSWORD=uno_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uno_user -d uno_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  frontend-data:
  postgres-data:
